---
# Versions are pinned to stay within the module's metadata.json dependency
# ranges. concat is a transitive dependency of postgresql and must be declared
# explicitly. The Resource API ships with Puppet 8, so it needs no fixture.
fixtures:
  forge_modules:
    stdlib:
      repo: "puppetlabs/stdlib"
      ref: "10.1.1"
    postgresql:
      repo: "puppetlabs/postgresql"
      ref: "10.8.0"
    apt:
      repo: "puppetlabs/apt"
      ref: "11.4.1"
    concat:
      repo: "puppetlabs/concat"
      ref: "10.1.0"
  symlinks:
    greenbone: "#{source_dir}"
